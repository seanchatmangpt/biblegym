name: ggen-boost
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  semantic-pack:
    runs-on: ubuntu-latest
    env:
      GGEN_VERSION: "26.8.15"
      GGEN_SHA256: "f4c4ea396f5cec12cfa2dd46c13ac620291f9b83138f17ded6fa59c510dcfc42"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned ggen
        run: |
          set -euo pipefail
          url="https://github.com/seanchatmangpt/ggen/releases/download/v${GGEN_VERSION}/ggen-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error "$url" -o /tmp/ggen.tar.gz
          echo "${GGEN_SHA256}  /tmp/ggen.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/ggen-bin
          tar -xzf /tmp/ggen.tar.gz -C /tmp/ggen-bin
          ggen_bin="$(find /tmp/ggen-bin -type f -name ggen -perm -111 | head -n1)"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
      - name: Generate twice and refuse non-idempotency
        # NOTE: unlike fdegym's fortune5 pack, biblegym-pack's ggen.toml manifest
        # (source/packs/templates paths) lives at the REPO ROOT, not inside
        # ggen/biblegym-pack/ itself -- confirmed by running `ggen sync run`
        # locally with GGEN_VERSION=26.8.8 from both locations. `ggen sync run`
        # from inside ggen/biblegym-pack fails with FM-CONFIG-001 (ggen.toml not
        # found). So working-directory here is the repo root, not the pack dir.
        working-directory: .
        run: |
          "$GGEN_BIN" --version
          timeout 5s "$GGEN_BIN" sync run
          cp -r src/biblegym /tmp/generated.first
          timeout 5s "$GGEN_BIN" sync run
          diff -r /tmp/generated.first src/biblegym