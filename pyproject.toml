[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biblegym"
version = "26.8.12"
description = "GymAct-compatible bounded executable worlds for church formation and operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sean Chatman"}]
dependencies = []

[project.optional-dependencies]
gymact = ["gymact>=26.8.8"]

[tool.setuptools.packages.find]
where = ["src"]
